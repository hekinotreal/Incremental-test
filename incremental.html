<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incremental</title>
<style>
body { font-family: sans-serif; max-width: 500px; margin: 20px auto; }
#points-display { font-size: 2rem; }
#pps-display { font-size: 0.9rem; color: #666; margin-bottom: 12px; }
#upgrades { display: flex; flex-direction: column; }
.u-row { display: flex; gap: 8px; margin: 8px 0; }
.u-row > div { flex: 1; margin: 0; }
.upgrade { border: 1px solid #999; padding: 10px; cursor: pointer; }
.upgrade.locked { opacity: 0.4; cursor: not-allowed; }
.upgrade.maxed { opacity: 0.5; cursor: not-allowed; }
.buymax { border: 1px solid #999; padding: 10px 14px; cursor: pointer; background: #fff; }
.buymax:disabled { opacity: 0.4; cursor: not-allowed; }
#buttons { margin-top: 12px; }
#buttons button { margin-right: 8px; }
</style>
</head>
<body>
<div id="points-display">0</div>
<div id="pps-display">0 pts/sec</div>
<div id="upgrades"></div>
<div id="buttons"></div>
<script src="metanum-main/metanum.js"></script>
<script src="metanum-main/format-metanum.js"></script>
<script>
var points = new MetaNum(0);
var baseRate = new MetaNum(1);
var lastTime = performance.now();
var upgrades = [];
function reg(up) { upgrades.push(up); }

var u1Level=0, u2Level=0, u3Level=0, u4Level=0, u5Level=0, u6Level=0, u7Level=0;
var hyperLevels=[];
for(var i=0;i<20;i++) hyperLevels.push(0);
var arrowLevels=[];
for(var i=0;i<973;i++) arrowLevels.push(0);

var TOTAL=1000;
var U7_IDX=6;
var HYPER_START=7;
var HYPER_COUNT=20;
var ARROW_START=27;
var ARROW_COUNT=973;

var hyperCostArrowCounts=[];
var hyperEffectArrowCounts=[];
var hyperCosts=[];
for(var i=0;i<HYPER_COUNT;i++){
  hyperCostArrowCounts.push(3+i);
  hyperEffectArrowCounts.push(4+i);
  hyperCosts.push(MetaNum.arrow(10,3+i,100));
}

var arrowParams=[];
for(var i=0;i<ARROW_COUNT;i++){
  var arrows=Math.floor(2+i*98/(ARROW_COUNT-1));
  var y;
  var cost;
  if(i<23){
    y=new MetaNum(100);
    cost=new MetaNum([[10000+i*500,2]]);
  }else if(i<200){
    var yt=Math.floor((i-23)/5)+1;
    y=new MetaNum(10).tetr(new MetaNum(yt+5));
    cost=new MetaNum([[10000+i*500,2]]);
  }else if(i<500){
    var yt=Math.floor((i-200)/10)+6;
    y=new MetaNum(10).tetr(new MetaNum(yt));
    cost=new MetaNum([[50000+Math.floor((i-200)*300),2]]);
  }else{
    var yt=Math.floor((i-500)/10)+10;
    y=new MetaNum(10).tetr(new MetaNum(yt));
    cost=new MetaNum([[150000+Math.floor((i-500)*1000),2]]);
  }
  arrowParams.push({arrows:arrows,y:y,cost:cost});
}

reg({
  id:'u1',name:'Triple Points',max:5,_level:0,
  level:function(){return u1Level;},
  cost:function(){return new MetaNum(5).mul(new MetaNum(Math.pow(5,this.level())));},
  effect:function(){return format(new MetaNum(Math.pow(3,this.level())),0)+'x';},
  buy:function(){var l=this.level();if(l>=this.max)return;var c=this.cost();if(points.lt(c))return;points=points.sub(c);u1Level++;},
  label:function(){var l=this.level();var c=this.cost();return this.name+' ['+l+'/'+this.max+'] - '+this.effect()+' effect - '+(l>=this.max?'MAXED':'Cost: '+format(c,0)+' pts');}
});

reg({
  id:'u2',name:'Power Boost',max:100,_level:0,
  level:function(){return u2Level;},
  cost:function(){return new MetaNum(20).mul(new MetaNum(Math.pow(1.2,this.level())));},
  effect:function(){return '^'+Math.pow(1.1,this.level()).toFixed(3);},
  buy:function(){var l=this.level();if(l>=this.max)return;var c=this.cost();if(points.lt(c))return;points=points.sub(c);u2Level++;},
  label:function(){var l=this.level();var c=this.cost();return this.name+' ['+l+'/'+this.max+'] - '+this.effect()+' effect - '+(l>=this.max?'MAXED':'Cost: '+format(c,0)+' pts');}
});

reg({
  id:'u3',name:'Super Power',max:1000,_level:0,
  level:function(){return u3Level;},
  cost:function(){return new MetaNum('2E32876').pow(new MetaNum(10.1).pow(new MetaNum(this.level())));},
  effect:function(){return '^'+format(new MetaNum(10).pow(new MetaNum(this.level())),3);},
  buy:function(){var l=this.level();if(l>=this.max)return;var c=this.cost();if(points.lt(c))return;points=points.sub(c);u3Level++;},
  buyMax:function(){var b=0;while(this.level()<this.max){var c=this.cost();if(points.lt(c))break;points=points.sub(c);this._level++;b++;if(b>10000)break;}},
  hasBuyMax:true,
  label:function(){var l=this.level();var c=this.cost();return this.name+' ['+l+'/'+this.max+'] - '+this.effect()+' effect - '+(l>=this.max?'MAXED':'Cost: '+format(c,0)+' pts');}
});

var u4Costs=[new MetaNum('1E328752'),new MetaNum('1E3320719'),new MetaNum('2E33550587'),new MetaNum([[3e9,1]]),new MetaNum([[3e13,1]]),new MetaNum([[3e20,1]]),new MetaNum([[4e45,1]]),new MetaNum([[7e89,1]]),new MetaNum([[1e121,1]]),new MetaNum([[2e217,1]]),new MetaNum([[320.95,2]]),new MetaNum([[431.903,2]])];
var u4Bases=[0,8,6,4,3,2,1.5,1.4,1.3,1.27,1.25,1.2];
var u4Divs=[0,55,30,20,15,10,10,10,10,10,10,10];
var U4_MAX=12;
function getU4Mult(){
  if(u4Level===0||!points.gt(MetaNum.ZERO))return MetaNum.ONE;
  if(u4Level===1)return points.pow(new MetaNum(0.01));
  var idx=Math.min(u4Level,u4Bases.length)-1;
  var logBase=points.log(new MetaNum(u4Bases[idx]));
  var mult=MetaNum.pow(new MetaNum(10),logBase.div(new MetaNum(u4Divs[idx])));
  var cap=new MetaNum([[1050,2]]);
  if(mult.gt(cap))mult=cap;
  return mult;
}
reg({
  id:'u4',name:'Point Multiplier',max:U4_MAX,_level:0,
  level:function(){return u4Level;},
  cost:function(){return u4Level<U4_MAX?u4Costs[u4Level]:MetaNum.POSITIVE_INFINITY;},
  effect:function(){return format(getU4Mult(),2)+'x';},
  buy:function(){var l=this.level();if(l>=this.max)return;var c=this.cost();if(points.lt(c))return;points=points.sub(c);u4Level++;},
  label:function(){var l=this.level();var c=this.cost();return this.name+' ['+l+'/'+this.max+'] - '+this.effect()+' effect - '+(l>=this.max?'MAXED':'Cost: '+format(c,0)+' pts');}
});

reg({
  id:'u5',name:'Tetration Boost',max:10,_level:0,
  level:function(){return u5Level;},
  cost:function(){return u5Level<10?new MetaNum([[1050,2]]).tetr(new MetaNum(1.1).pow(new MetaNum(u5Level))):MetaNum.POSITIVE_INFINITY;},
  effect:function(){return u5Level>0?'^^'+format(new MetaNum(2).pow(new MetaNum(u5Level)),0):'^^1';},
  buy:function(){var l=this.level();if(l>=this.max)return;var c=this.cost();if(points.lt(c))return;points=points.sub(c);u5Level++;},
  label:function(){var l=this.level();var c=this.cost();return this.name+' ['+l+'/'+this.max+'] - '+this.effect()+' effect - '+(l>=this.max?'MAXED':'Cost: '+format(c,0)+' pts');}
});

var u6BaseCost=new MetaNum(3).tetr(1026);
reg({
  id:'u6',name:'Hyper Boost',max:10,_level:0,
  level:function(){return u6Level;},
  cost:function(){return u6Level<10?u6BaseCost.tetr(new MetaNum(150).pow(new MetaNum(u6Level))):MetaNum.POSITIVE_INFINITY;},
  effect:function(){return u6Level>0?'^^'+format(new MetaNum(Math.pow(100000,u6Level)),0):'^^1';},
  buy:function(){var l=this.level();if(l>=this.max)return;var c=this.cost();if(points.lt(c))return;points=points.sub(c);u6Level++;},
  label:function(){var l=this.level();var c=this.cost();return this.name+' ['+l+'/'+this.max+'] - '+this.effect()+' effect - '+(l>=this.max?'MAXED':'Cost: '+format(c,0)+' pts');}
});

reg({
  id:'u7',name:'Omni Boost',max:1,_level:0,
  level:function(){return u7Level;},
  cost:function(){return u7Level<1?new MetaNum('F1E50'):MetaNum.POSITIVE_INFINITY;},
  effect:function(){return u7Level>0?'^^^100':'^^^1';},
  buy:function(){var l=this.level();if(l>=this.max)return;var c=this.cost();if(points.lt(c))return;points=points.sub(c);u7Level++;},
  label:function(){var l=this.level();var c=this.cost();return this.name+' ['+l+'/'+this.max+'] - '+this.effect()+' effect - '+(l>=this.max?'MAXED':'Cost: '+format(c,0)+' pts');}
});

for(var i=0;i<HYPER_COUNT;i++){
  (function(idx){
    reg({
      id:'h'+idx,name:'Hyper-'+(HYPER_START+1+idx),max:1,_level:0,
      level:function(){return hyperLevels[idx];},
      cost:function(){return hyperLevels[idx]<1?hyperCosts[idx]:MetaNum.POSITIVE_INFINITY;},
      effect:function(){return '^['+hyperEffectArrowCounts[idx]+']^^100';},
      buy:function(){var l=this.level();if(l>=this.max)return;var c=this.cost();if(points.lt(c))return;points=points.sub(c);hyperLevels[idx]++;},
      label:function(){var l=this.level();var c=this.cost();return this.name+' ['+l+'/'+this.max+'] - '+this.effect()+' effect - '+(l>=this.max?'MAXED':'Cost: '+format(c,0)+' pts');}
    });
  })(i);
}

for(var i=0;i<ARROW_COUNT;i++){
  (function(idx){
    reg({
      id:'a'+idx,name:'Upgrade-'+(ARROW_START+1+idx),max:1,_level:0,
      level:function(){return arrowLevels[idx];},
      cost:function(){return arrowLevels[idx]<1?arrowParams[idx].cost:MetaNum.POSITIVE_INFINITY;},
      effect:function(){return '↑'+arrowParams[idx].arrows+'(y'+format(arrowParams[idx].y,0)+')';},
      buy:function(){var l=this.level();if(l>=this.max)return;var c=this.cost();if(points.lt(c))return;points=points.sub(c);arrowLevels[idx]++;},
      label:function(){var l=this.level();var c=this.cost();return this.name+' ['+l+'/'+this.max+'] - '+this.effect()+' effect - '+(l>=this.max?'MAXED':'Cost: '+format(c,0)+' pts');}
    });
  })(i);
}

function getEffectiveGain(){
  var raw=baseRate.mul(new MetaNum(Math.pow(3,u1Level)));
  var pw=Math.pow(1.1,u2Level);
  if(pw!==1)raw=raw.pow(new MetaNum(pw));
  var sp=new MetaNum(10).pow(new MetaNum(u3Level));
  if(sp.gt(MetaNum.ONE))raw=raw.pow(sp);
  raw=raw.mul(getU4Mult());
  if(u5Level>0&&points.gt(MetaNum.ZERO))raw=raw.tetr(new MetaNum(Math.pow(2,u5Level)));
  if(u6Level>0&&points.gt(MetaNum.ZERO))raw=raw.tetr(new MetaNum(Math.pow(100000,u6Level)));
  if(u7Level>0&&points.gt(MetaNum.ZERO)){
    var result=raw;
    for(var i=2;i<=100;i++)result=raw.tetr(result);
    raw=result;
  }
  for(var i=0;i<HYPER_COUNT;i++){
    if(hyperLevels[i]>0&&points.gt(MetaNum.ZERO)){
      raw=MetaNum.arrow(raw,hyperEffectArrowCounts[i],100);
    }
  }
  for(var i=0;i<ARROW_COUNT;i++){
    if(arrowLevels[i]>0&&points.gt(MetaNum.ZERO)){
      raw=MetaNum.arrow(raw,arrowParams[i].arrows,arrowParams[i].y);
    }
  }
  return raw;
}

function autobuyBase(){
  if(hyperLevels[19]>0){
    for(var i=0;i<upgrades.length;i++)upgrades[i].buy();
  }
}

function buildUI(){
  var c=document.getElementById('upgrades');
  for(var i=0;i<upgrades.length;i++){
    var up=upgrades[i];
    var row=document.createElement('div');
    row.className='u-row';
    var div=document.createElement('div');
    div.className='upgrade locked';
    div.id=up.id;
    div.addEventListener('click',(function(idx){return function(){upgrades[idx].buy();};})(i));
    row.appendChild(div);
    if(up.hasBuyMax){
      var btn=document.createElement('button');
      btn.className='buymax';
      btn.textContent='Buy Max';
      btn.addEventListener('click',(function(idx){return function(){upgrades[idx].buyMax();};})(i));
      row.appendChild(btn);
    }
    c.appendChild(row);
  }
}

function updateUI(){
  document.getElementById('points-display').textContent=format(points,2);
  document.getElementById('pps-display').textContent=format(getEffectiveGain(),2)+' pts/sec';
  for(var i=0;i<upgrades.length;i++){
    var up=upgrades[i];
    var el=document.getElementById(up.id);
    var l=up.level();
    var c=up.cost();
    el.textContent=up.label();
    if(l>=up.max)el.className='upgrade maxed';
    else el.className=points.gte(c)?'upgrade':'upgrade locked';
    if(up.hasBuyMax)el.parentElement.querySelector('.buymax').disabled=(l>=up.max||points.lt(c));
  }
}

function saveGame(){
  var data={
    points:points.toString(),
    u1Level:u1Level,u2Level:u2Level,u3Level:u3Level,
    u4Level:u4Level,u5Level:u5Level,u6Level:u6Level,u7Level:u7Level,
    hyperLevels:hyperLevels.slice(),
    arrowLevels:arrowLevels.slice()
  };
  localStorage.setItem('metaIncrementalSave',JSON.stringify(data));
}

function loadGame(){
  var raw=localStorage.getItem('metaIncrementalSave');
  if(!raw)return;
  try{
    var data=JSON.parse(raw);
    points=new MetaNum(data.points||'0');
    u1Level=data.u1Level||0;u2Level=data.u2Level||0;u3Level=data.u3Level||0;
    u4Level=data.u4Level||0;u5Level=data.u5Level||0;u6Level=data.u6Level||0;u7Level=data.u7Level||0;
    if(data.hyperLevels)for(var i=0;i<HYPER_COUNT;i++)hyperLevels[i]=data.hyperLevels[i]||0;
    if(data.arrowLevels)for(var i=0;i<ARROW_COUNT;i++)arrowLevels[i]=data.arrowLevels[i]||0;
  }catch(e){}
}

function resetGame(){
  if(!confirm('Reset all data?'))return;
  localStorage.removeItem('metaIncrementalSave');
  points=new MetaNum(0);
  u1Level=0;u2Level=0;u3Level=0;u4Level=0;u5Level=0;u6Level=0;u7Level=0;
  for(var i=0;i<HYPER_COUNT;i++)hyperLevels[i]=0;
  for(var i=0;i<ARROW_COUNT;i++)arrowLevels[i]=0;
  updateUI();
}

function exportSave(){
  var data=localStorage.getItem('metaIncrementalSave');
  if(!data){alert('No save data.');return;}
  navigator.clipboard.writeText(btoa(data)).then(function(){alert('Save copied to clipboard!');});
}

function importSave(){
  var input=prompt('Paste your save data:');
  if(!input)return;
  try{var decoded=atob(input);JSON.parse(decoded);localStorage.setItem('metaIncrementalSave',decoded);loadGame();updateUI();alert('Save imported!');}catch(e){alert('Invalid save data.');}
}

function buildButtons(){
  var c=document.getElementById('buttons');
  var b1=document.createElement('button');b1.textContent='Export';b1.addEventListener('click',exportSave);c.appendChild(b1);
  var b2=document.createElement('button');b2.textContent='Import';b2.addEventListener('click',importSave);c.appendChild(b2);
  var b3=document.createElement('button');b3.textContent='Reset Data';b3.addEventListener('click',resetGame);c.appendChild(b3);
}

function gameLoop(now){
  var dt=(now-lastTime)/1000;
  lastTime=now;
  autobuyBase();
  points=points.add(getEffectiveGain().mul(new MetaNum(dt)));
  updateUI();
  saveGame();
  requestAnimationFrame(gameLoop);
}

buildUI();
buildButtons();
loadGame();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
